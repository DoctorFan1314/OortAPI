<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120" width="100%" height="100%">
  <defs>
    <linearGradient id="combo-dark-o-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="combo-dark-orbit-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF87" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#00FF87" />
    </linearGradient>

    <linearGradient id="combo-dark-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <filter id="combo-dark-neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="combo-dark-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>
  </defs>

  <g transform="translate(10, 10) scale(0.2)">
    <circle cx="250" cy="250" r="160" fill="#4f46e5" opacity="0.08" filter="url(#combo-dark-soft)" />
    <circle cx="250" cy="250" r="120" fill="#00FF87" opacity="0.05" filter="url(#combo-dark-soft)" />

    <g filter="url(#combo-dark-neon)">
      <path d="M 105,205 A 190,55 0 0,1 395,295" fill="none" stroke="url(#combo-dark-orbit-grad)" stroke-width="4" stroke-dasharray="8 4 2 4" transform="rotate(-28 250 250)" opacity="0.6"/>
      <path d="M 135,225 A 150,40 0 0,1 365,275" fill="none" stroke="#00FF87" stroke-width="2" stroke-opacity="0.4" transform="rotate(35 250 250)" stroke-dasharray="4 4"/>
    </g>

    <g>
      <circle cx="250" cy="250" r="90" fill="none" stroke="url(#combo-dark-o-grad)" stroke-width="32" stroke-linecap="round" />
      <circle cx="250" cy="250" r="74" fill="none" stroke="#030712" stroke-width="2" opacity="0.3" />
      <circle cx="250" cy="250" r="106" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.15" />
    </g>

    <path d="M 395,295 A 190,55 0 0,1 105,205" fill="none" stroke="url(#combo-dark-orbit-grad)" stroke-width="5" stroke-linecap="round" transform="rotate(-28 250 250)" filter="url(#combo-dark-neon)" />
    <path d="M 365,275 A 150,40 0 0,1 135,225" fill="none" stroke="#00FF87" stroke-width="2.5" stroke-linecap="round" transform="rotate(35 250 250)" filter="url(#combo-dark-neon)" />

    <g filter="url(#combo-dark-neon)">
      <circle cx="120" cy="180" r="5" fill="#00FF87" />
      <circle cx="120" cy="180" r="9" fill="#00FF87" opacity="0.3" filter="url(#combo-dark-neon)"/>
      <circle cx="380" cy="320" r="4" fill="#60a5fa" />
      <circle cx="290" cy="140" r="6" fill="#ffffff" />
      <circle cx="190" cy="370" r="5" fill="#00FF87" />
      <circle cx="210" cy="120" r="3" fill="#00FF87" opacity="0.8"/>
      <circle cx="310" cy="360" r="4.5" fill="#d946ef" />
      <circle cx="100" cy="290" r="3.5" fill="#60a5fa" />
    </g>
  </g>

  <g transform="translate(130, 74)">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#combo-dark-text)" letter-spacing="-1px">Oort</text>
    <text x="100" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="400" fill="#6b7280" letter-spacing="0.5px">API</text>
  </g>
</svg>
